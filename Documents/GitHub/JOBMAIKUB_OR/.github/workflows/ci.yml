name: JOBMAIKUB CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Lint
        run: npm run lint || true
        working-directory: ./backend

      - name: Build application
        run: npm run build
        working-directory: ./backend

      - name: Run Unit Tests
        run: npm run test
        working-directory: ./backend

      - name: Run E2E Tests
        run: npm run test:e2e -- --forceExit
        working-directory: ./backend
        env:
          SUPABASE_URL: https://dummy-supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-key
          RESEND_API_KEY: dummy-key
          RESEND_FROM_EMAIL: no-reply@example.com

  backend-deploy:
    name: Deploy Backend (Render)
    needs: backend-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            exit 1
          fi
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  frontend-ci:
    name: Frontend CI (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Lint
        run: npm run lint || true
        working-directory: ./frontend

      - name: Build application
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xfqefobzbchqwldovrni.supabase.co/' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmcWVmb2J6YmNocXdsZG92cm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NjM2MjYsImV4cCI6MjA4MzQzOTYyNn0.sGuMiF1kdQsUhsaP_bO4Io0TeVCkdXSYGo68BYRQTCs' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  frontend-deploy:
    name: Deploy Frontend (Cloudflare Pages)
    needs: frontend-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build application
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://xfqefobzbchqwldovrni.supabase.co/' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmcWVmb2J6YmNocXdsZG92cm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NjM2MjYsImV4cCI6MjA4MzQzOTYyNn0.sGuMiF1kdQsUhsaP_bO4Io0TeVCkdXSYGo68BYRQTCs' }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ./frontend
